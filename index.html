<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dear My Bear</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <!-- 💡 style.css 연결 -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <!-- 다이어리 전체 감싸는 메인 틀 추가 -->
  <div class="diary-container">

  <!-- 1. 표지 화면 -->
    <div id="lockScreen" class="lock-screen">
      <!-- 🐾 통통 튀는 발자국 이미지 버튼 -->
      <img src="paws.png" class="paw-click-area" onclick="openDiary()" title="곰발자국을 눌러서 열기" alt="곰발자국">
    </div>

    <!-- 2. 일기장 메인 공간 -->
    <div id="diaryMainContent" class="diary-main-content">

      <!-- 목차(홈) 화면 -->
      <div id="homeSection" class="home-section">
        <div class="home-header">
          <div class="home-emoji">🧸</div>
          <div class="home-title">Dear My Bear</div>
        </div>
        <button class="home-tile" onclick="switchTab('calendar')">
          <span class="home-tile-icon">📅</span>
          <span class="home-tile-text">
            <span class="home-tile-title">달력</span>
            <span class="home-tile-desc">날짜별 일기장</span>
          </span>
        </button>
        <button class="home-tile" onclick="openBoard()">
          <span class="home-tile-icon">💌</span>
          <span class="home-tile-text">
            <span class="home-tile-title">팬보드</span>
            <span class="home-tile-desc">스푼 글 모음 · 사진</span>
          </span>
        </button>
      </div>

      <!-- 팬보드 화면 -->
      <div id="boardSection" class="board-section">
        <div class="board-topbar">
          <button class="btn-back btn-back-tight" onclick="switchTab('home')">‹ 목차</button>
          <button class="btn-icon-small" onclick="openBoardWrite()" title="글 쓰기">＋</button>
        </div>
        <div class="board-title">💌 팬보드</div>
        <div id="boardFilter" class="board-filter"></div>
        <div id="boardList" class="board-list"></div>
      </div>

      <!-- 달력 영역 -->
      <div id="calendarSection">
      <button class="btn-back btn-back-tight" onclick="switchTab('home')">‹ 목차</button>
      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)" title="이전달">‹</button>
        <div class="calendar-title-group">
          <span class="calendar-title-text"><span id="calendarTitleText"></span><span class="calendar-title-caret">▾</span></span>
          <select id="selectYear" class="year-month-select" onchange="onSelectYearMonthChange()" aria-label="연도 선택"></select>
          <select id="selectMonth" class="year-month-select" onchange="onSelectYearMonthChange()" aria-label="월 선택"></select>
        </div>
        <button class="nav-btn" onclick="changeMonth(1)" title="다음달">›</button>
      </div>

        <div class="calendar-grid">
          <div class="day-header sun">일</div>
          <div class="day-header">월</div>
          <div class="day-header">화</div>
          <div class="day-header">수</div>
          <div class="day-header">목</div>
          <div class="day-header">금</div>
          <div class="day-header sat">토</div>
        </div>

        <div id="calendarDates" class="calendar-grid"></div>

        <div id="actionButtons" class="action-buttons">
          <button id="secretListBtn" class="btn-icon" onclick="switchTab('secret')" title="전체 글 관리">📋</button>
          <button id="trashListBtn" class="btn-icon" onclick="switchTab('trash')" title="휴지통">🗑️</button>
        </div>
      </div>

      <!-- 🐻 곰 그림 근처를 길게 누르면 관리자 인증/해제 (숨겨진 진입점) -->
      <div id="adminHotspot" class="admin-hotspot" title=""></div>

      <!-- 관리자 전용 공간: 전체 글 관리 (공개/비밀 전환) -->
      <div id="secretSection" class="admin-section">
        <button class="btn-back" onclick="switchTab('calendar')">⬅️ 달력으로</button>
        <h2 style="color: #5a4636;">📋 전체 글 관리</h2>
        <div id="secretList"></div>
      </div>

      <!-- 관리자 전용 공간: 휴지통 -->
      <div id="trashSection" class="admin-section">
        <button class="btn-back" onclick="switchTab('calendar')">⬅️ 달력으로</button>
        <h2 style="color: #5a4636;">🗑️ 휴지통 (삭제된 일기)</h2>
        <div id="trashList"></div>
      </div>

    </div>
  </div>

  <!-- 일기 보기 모달 팝업 -->
  <div id="viewModalOverlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-date-row">
        <div class="modal-date-nav">
          <button id="prevEntryBtn" class="modal-nav-arrow" onclick="navigateEntry(-1)" title="이전 글">‹</button>
          <div id="viewModalDate" class="modal-date">2026년 9월 9일 수요일</div>
          <button id="nextEntryBtn" class="modal-nav-arrow" onclick="navigateEntry(1)" title="다음 글">›</button>
        </div>
        <button id="viewWriteBtn" class="btn-icon-small" onclick="openNewEntryFromView()" title="새 일기 쓰기">✏️</button>
      </div>

      <div class="modal-scroll-area">
        <div id="modalInfo" class="author-tabs"></div>
        <div id="viewModalText" class="modal-text">일기 내용</div>
      </div>

      <div class="modal-btn-group">
        <button id="deleteBtn" class="btn-delete-text" onclick="deleteCurrentDiary()" style="display:none;">삭제</button>
        <button class="btn-close-pill" onclick="closeViewModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 새 일기 쓰기 / 수정 모달 팝업 -->
  <div id="writeModalOverlay" class="modal-overlay">
    <div class="modal-card">
      <div id="writeModalTitle" class="modal-date write-modal-title">새 일기 작성하기</div>
      
      <div class="form-group">
        <label for="inputDate">날짜 선택</label>
        <input type="date" id="inputDate" class="form-control">
      </div>

      <div class="form-group">
        <label for="inputContent">일기 내용</label>
        <textarea id="inputContent" class="form-control" placeholder="오늘 어떤 일이 있었나요?"></textarea>
      </div>

      <div class="modal-btn-group">
        <button class="btn-cancel" onclick="closeWriteModal()">취소</button>
        <button class="btn-submit" onclick="saveDiary()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 팬보드 글 보기 모달 -->
  <div id="boardViewOverlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-date-row">
        <div class="modal-date-nav">
          <div id="boardViewDate" class="modal-date"></div>
          <span id="boardViewTag" class="board-tag"></span>
        </div>
      </div>
      <div class="modal-scroll-area">
        <div id="boardViewTitle" class="board-view-title"></div>
        <div id="boardViewText" class="modal-text"></div>
        <div id="boardViewPhotos" class="board-photo-grid"></div>
      </div>
      <div class="modal-btn-group">
        <button id="boardEditBtn" class="btn-delete-text board-edit-btn" onclick="editCurrentBoardPost()" style="display:none;">수정</button>
        <button id="boardDeleteBtn" class="btn-delete-text" onclick="deleteCurrentBoardPost()" style="display:none;">삭제</button>
        <button class="btn-close-pill" onclick="closeBoardView()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 팬보드 글쓰기 / 수정 모달 -->
  <div id="boardWriteOverlay" class="modal-overlay">
    <div class="modal-card">
      <div id="boardWriteTitle" class="modal-date write-modal-title">팬보드 글쓰기</div>
      <div class="modal-scroll-area">
        <div class="form-group">
          <label for="boardInputDate">날짜</label>
          <input type="date" id="boardInputDate" class="form-control">
        </div>
        <div class="form-group">
          <label>구분</label>
          <div id="boardTagPicker" class="board-tag-picker"></div>
        </div>
        <div class="form-group">
          <label for="boardInputTitle">제목 (선택)</label>
          <input type="text" id="boardInputTitle" class="form-control" maxlength="80" placeholder="제목을 적어도 되고, 비워도 돼요">
        </div>
        <div class="form-group">
          <label for="boardInputContent">내용</label>
          <textarea id="boardInputContent" class="form-control" placeholder="스푼 팬보드 글이나 남기고 싶은 말을 적어주세요"></textarea>
        </div>
        <div class="form-group">
          <label>사진 <span id="boardPhotoCount" class="board-photo-count"></span></label>
          <div id="boardPhotoPreview" class="board-photo-preview"></div>
          <button type="button" class="board-photo-add" onclick="document.getElementById('boardPhotoInput').click()">📷 사진 추가</button>
          <input type="file" id="boardPhotoInput" accept="image/*" multiple hidden onchange="onBoardPhotosPicked(event)">
        </div>
      </div>
      <div class="modal-btn-group">
        <button class="btn-cancel" onclick="closeBoardWrite()">취소</button>
        <button id="boardSaveBtn" class="btn-submit" onclick="saveBoardPost()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div id="photoLightbox" class="photo-lightbox" onclick="closeLightbox()">
    <img id="photoLightboxImg" alt="">
  </div>

  <!-- 비밀번호 입력 모달 (표지 열기 / 관리자 인증 공용) -->
  <div id="passwordModalOverlay" class="modal-overlay">
    <div class="password-card">
      <div class="password-emoji">🧸</div>
      <div id="passwordModalLabel" class="password-label">비밀번호를 입력해주세요</div>
      <div id="passwordDigitBoxes" class="password-digit-boxes"></div>
      <div id="passwordModalError" class="password-error" style="display:none;">비밀번호가 틀렸어요, 다시 시도해주세요</div>
      <button class="btn-close-pill password-confirm-btn" onclick="submitPasswordModal()">확인</button>
      <div class="password-cancel" onclick="closePasswordModal()">취소</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 💡 script.js 연결 -->
  <script src="script.js?v=2"></script>
  <script src="board.js"></script>
</body>
</html>
